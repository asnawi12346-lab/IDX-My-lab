name: IDX to Telegram

on:
  workflow_dispatch:

jobs:
  idx-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run IDX daily
        run: uv run idx daily

      - name: Run IDX signals
        run: uv run idx signals

      - name: Send IDX briefing to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE=$(find data/briefings -type f -name "*.md" -print -quit)

          if [ -z "$FILE" ]; then
            echo "Briefing tidak ditemukan"
            exit 1
          fi

          echo "Mengirim briefing: $FILE"

          python - "$FILE" <<'PY'
          import os
          import sys
          import urllib.request
          import urllib.parse

          file_path = sys.argv[1]

          with open(file_path, "r", encoding="utf-8") as f:
              text = f.read()

          max_len = 3900

          if len(text) > max_len:
              text = text[:max_len] + "\n\n...[dipotong]"

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          message = "📊 IDX-My-lab Briefing\n\n" + text

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          PY
