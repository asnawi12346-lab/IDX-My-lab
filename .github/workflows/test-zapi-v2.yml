```yaml
name: Test Zapi V2

on:
  workflow_dispatch:

jobs:
  test-zapi:
    runs-on: ubuntu-latest

    steps:
      - name: Test Zapi Stock Summary
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          url = "https://api.zpi.web.id/v1/finance:idx/stock-summary?code=BBRI"

          req = urllib.request.Request(
              url,
              headers={
                  "x-api-key": os.environ["ZAPI_API_KEY"]
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("HTTP:", r.status)
                  print(r.read().decode())
          except Exception as e:
              print("ERROR:", repr(e))
              raise

          PY

      - name: Test Zapi Broker Summary
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        run: |
