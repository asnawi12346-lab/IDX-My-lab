```yaml
name: Test Zapi V2

on:
  workflow_dispatch:

jobs:
  test-zapi:
    runs-on: ubuntu-latest

    steps:
      - name: Test Zapi Stock Summary
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.parse

          params = urllib.parse.urlencode({
              "code": "BBRI",
              "length": 1,
              "start": 0
          })

          url = (
              "https://api.zpi.web.id/v1/finance:idx/"
              "stock-summary?"
              + params
          )

          req = urllib.request.Request(
              url,
              headers={
                  "x-api-key": os.environ["ZAPI_API_KEY"]
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("HTTP:", r.status)
                  print(r.read().decode())
          except Exception as e:
              print("ERROR:", repr(e))
              raise
          PY

      - name: Test Zapi Broker Summary
