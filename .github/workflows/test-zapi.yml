name: TEST 5 - Zapi IDX

on:
  workflow_dispatch:

jobs:
  test-zapi:
    runs-on: ubuntu-latest

    steps:
      - name: Test Zapi IDX
        env:
          ZAPI_API_KEY: ${{ secrets.ZAPI_API_KEY }}
        run: |
          set +e

          echo "======================================"
          echo "TEST 5 - ZAPI IDX"
          echo "======================================"

          if [ -z "$ZAPI_API_KEY" ]; then
            echo "ERROR: ZAPI_API_KEY belum ada di GitHub Secrets"
            exit 1
          fi

          test_endpoint () {
            NAME="$1"
            URL="$2"

            echo
            echo "======================================"
            echo "$NAME"
            echo "======================================"
            echo "URL: $URL"

            curl -sS \
              --max-time 30 \
              -w "\nHTTP_STATUS:%{http_code}\nTIME:%{time_total}s\n" \
              -H "x-api-key: ${ZAPI_API_KEY}" \
              -H "Accept: application/json" \
              "$URL"

            echo
          }

          test_endpoint \
            "1. STOCK SUMMARY" \
            "https://api.zpi.web.id/v1/finance:idx/stock-summary?length=5&start=0&date=20260912"

          test_endpoint \
            "2. INDEX SUMMARY" \
            "https://api.zpi.web.id/v1/finance:idx/index-summary?length=10&start=0&date=20260912"

          test_endpoint \
            "3. BROKER SUMMARY" \
            "https://api.zpi.web.id/v1/finance:idx/broker-summary?length=10&start=0&date=20260912"

          test_endpoint \
            "4. FOREIGN FLOW" \
            "https://api.zpi.web.id/v1/finance:idx/foreign-flow?date=20260912&sort=net&length=10&start=0"

          test_endpoint \
            "5. BBRI HISTORY" \
            "https://api.zpi.web.id/v1/finance:idx/stock-history?code=BBRI&from=2026-09-01&to=2026-09-12&length=30"

          echo
          echo "======================================"
          echo "TEST 5 SELESAI"
          echo "======================================"
